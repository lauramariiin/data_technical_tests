version: 2

models:
  - name: fct_visits
    description: >
      Tabla de hechos incremental con las visitas a puntos de venta.
      Solo procesa visitas nuevas o actualizadas utilizando updated_at.
      La clave única es visit_id.

    columns:
      - name: visit_id
        description: >
          Identificador único de la visita. Se utiliza como clave única
          del modelo incremental. Campo obligatorio.
        tests:
          - not_null
          - unique

      - name: intervention_point_id
        description: >
          Identificador del punto de venta visitado. Campo obligatorio.
        tests:
          - not_null
          - relationships:
              to: ref('dim_pos_unified')
              field: omni_id

      - name: route_id
        description: >
          Identificador de la ruta asociada a la visita.
          Campo obligatorio.
        tests:
          - not_null

      - name: campaign_id
        description: >
          Identificador de la campaña asociada a la visita.
          Campo obligatorio.
        tests:
          - not_null
          - relationships:
              to: ref('stg_campaigns')
              field: campaign_id

      - name: visit_date
        description: >
          Fecha en la que se realizó la visita. Campo obligatorio.
        tests:
          - not_null

      - name: visit_status
        description: >
          Estado de la visita normalizado. 
          Campo obligatorio.
        tests:
          - not_null
          - accepted_values:
              values: ['OK', 'INCID', 'INFO', 'NOVIS']

      - name: created_at
        description: >
          Fecha de creación del registro de visita. Campo opcional.

      - name: updated_at
        description: >
          Fecha de última actualización de la visita. Se utiliza como
          cursor incremental. Campo obligatorio.
        tests:
          - not_null